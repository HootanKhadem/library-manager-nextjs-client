<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1917">
  <title>Offline — toumaar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #1c1917; color: #fafaf9; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 420px; text-align: center; }
    svg { display: block; margin: 0 auto 28px; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; }
    p { margin: 0 0 28px; color: #a8a29e; }
    button { border: 0; border-radius: 999px; padding: 12px 24px; background: #e11d48; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <svg width="72" height="72" viewBox="0 0 64 64" role="img" aria-label="toumaar">
      <rect width="64" height="64" rx="14" fill="#e11d48"/>
      <path d="M11 20c8-2.5 15-1 21 4 6-5 13-6.5 21-4v25c-8-2.5-15-1-21 4-6-5-13-6.5-21-4zM32 24v25" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>You’re offline</h1>
    <p>Reconnect to open toumaar. Your library stays on the server, so books and loans need a connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
